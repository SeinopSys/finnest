services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: nest-api-dev
    ports:
      - '3000:3000'
      - '5555:5555' # Prisma Studio
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5433/mydb?schema=public'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: postgres-db-dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - '5433:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
