services:
  api:
    build: .
    container_name: finnest
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/mydb?schema=public'
      SHADOW_DATABASE_URL: 'postgresql://postgres:postgres@db:5432/mydb_shadow?schema=public'
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: postgres-db
    restart: always
    expose:
      - '5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: mydb, mydb_test, mydb_shadow
    volumes:
      - ./docker/create-dbs.sh:/docker-entrypoint-initdb.d/create-dbs.sh
      - pgdata:/var/lib/postgresql/data
      - node_modules:/app/node_modules
      - prisma-client:/app/src/generated/prisma
      - dist:/app/dist

volumes:
  pgdata:
  node_modules:
  prisma-client:
  dist:
