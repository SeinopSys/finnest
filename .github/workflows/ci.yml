name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Upgrade NPM
        run: npm install -g npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Prepare .env
        run: |
          cp .env.example .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Start built-in PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo systemctl status postgresql.service
          sudo -u postgres psql -c "CREATE DATABASE finnest;"
          sudo -u postgres psql -c "CREATE DATABASE finnest_shadow;"
          sudo -u postgres psql -c "CREATE DATABASE finnest_test;"
          sudo -u postgres psql -c "CREATE USER username PASSWORD 'password' SUPERUSER;"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        run: npm run test:cov
