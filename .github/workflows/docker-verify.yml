name: Verify Docker Builds

on: [push, pull_request]

concurrency:
  group: docker-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production docker-compose stack
        run: |
          docker compose -f docker-compose.yml build

  verify-development-docker-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development docker-compose stack
        run: |
          docker compose -f docker-compose.dev.yml build
